<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareerPilot AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #172033;
        }

        .navbar {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
        }

        .logo span {
            color: #6366f1;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logout {
            border: none;
            background: #111827;
            color: white;
            padding: 9px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .layout {
            display: flex;
            min-height: calc(100vh - 70px);
        }

        .sidebar {
            width: 230px;
            background: #111827;
            color: white;
            padding: 25px 15px;
        }

        .sidebar h3 {
            margin-bottom: 25px;
            padding-left: 10px;
        }

        .menu {
            padding: 13px 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
        }

        .menu:hover,
        .menu.active {
            background: #6366f1;
        }

        .main {
            flex: 1;
            padding: 35px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1 {
            font-size: 30px;
            margin-bottom: 7px;
        }

        .welcome p {
            color: #6b7280;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 14px;
            border: 1px solid #e5e7eb;
        }

        .card-title {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .card-value {
            font-size: 28px;
            font-weight: 700;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .panel {
            background: white;
            padding: 25px;
            border-radius: 14px;
            border: 1px solid #e5e7eb;
        }

        .panel h2 {
            margin-bottom: 20px;
        }

        .profile-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .profile-row:last-child {
            border-bottom: none;
        }

        .label {
            color: #6b7280;
        }

        .score {
            text-align: center;
            padding: 20px;
        }

        .score-number {
            font-size: 55px;
            font-weight: 800;
            color: #6366f1;
        }

        .progress {
            height: 10px;
            background: #e5e7eb;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 12px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #6366f1;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fb;
        }

        .login-box {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        .login-box h1 {
            margin-bottom: 8px;
        }

        .login-box p {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #6366f1;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .error {
            color: #dc2626;
            margin-top: 12px;
            font-size: 14px;
        }

        @media (max-width: 900px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .content-grid {
                grid-template-columns: 1fr;
            }

            .sidebar {
                width: 190px;
            }
        }

        @media (max-width: 650px) {
            .layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .main {
                padding: 20px;
            }
        }
    </style>
</head>

function showLogin() {

    app.innerHTML = `

                <p>Your personalized career preparation platform.</p>

                <input
                    id="email"
                    class="input"
                    type="email"
                    placeholder="Email"
                >

                <input
                    id="password"
                    class="input"
                    type="password"
                    placeholder="Password"
                >

                <button class="login-btn" onclick="login()">
                    Login
                </button>

                <div id="error" class="error"></div>

            </div>

        </div>
    `;
}


async function login() {

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const error = document.getElementById("error");

    error.innerText = "";

    try {

        const response = await fetch("/auth/token", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email: email,
                password: password
            })

        });

        const data = await response.json();

        if (!response.ok) {

            error.innerText =
                data.detail || "Login failed";

            return;
        }

        localStorage.setItem(
            "careerpilot_token",
            data.access_token
        );

        loadDashboard();

    } catch (err) {

        error.innerText =
            "Server connection failed.";

    }
}


async function loadDashboard() {

    const token =
        localStorage.getItem("careerpilot_token");

    if (!token) {

        showLogin();

        return;
    }

    try {

        const response = await fetch("/dashboard", {

            headers: {
                "Authorization": "Bearer " + token
            }

        });

        const data = await response.json();

        if (!response.ok) {

            localStorage.removeItem("careerpilot_token");

            showLogin();

            return;
        }

        renderDashboard(data);

    } catch (err) {

        showLogin();

    }
}

async function addDSAAttempt() {

    const token =
        localStorage.getItem("careerpilot_token");

    const dashboardResponse = await fetch(
        "/dashboard",
        {
            headers: {
                "Authorization": "Bearer " + token
            }
        }
    );

    const dashboard =
        await dashboardResponse.json();

    const studentId =
        dashboard.student.id;


    const question =
        document.getElementById("dsaQuestion").value;

    const topic =
        document.getElementById("dsaTopic").value;

    const difficulty =
        document.getElementById("dsaDifficulty").value;

    const status =
        document.getElementById("dsaStatus").value;

    const timeTaken =
        Number(
            document.getElementById("dsaTime").value
        );

    const attemptNumber =
        Number(
            document.getElementById("dsaAttempt").value
        );


    if (
        !question ||
        !topic ||
        !timeTaken ||
        !attemptNumber
    ) {

        document.getElementById("dsaMessage").innerText =
            "Please fill all fields.";

        return;
    }


    const response = await fetch(
        "/dsa/attempts",
        {

            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },

            body: JSON.stringify({

                student_id: studentId,
                question: question,
                topic: topic,
                difficulty: difficulty,
                status: status,
                time_taken_minutes: timeTaken,
                attempt_number: attemptNumber

            })

        }
    );


    const data = await response.json();


    if (!response.ok) {

        document.getElementById("dsaMessage").innerText =
            data.detail || "Failed to save attempt.";

        return;
    }


    document.getElementById("dsaMessage").innerText =
        "✅ DSA attempt saved successfully!";


    setTimeout(() => {

        showDSA();

    }, 700);
}
async function showStudyPlan() {

        localStorage.getItem("careerpilot_token");

            "/dashboard",
            {
                headers: {
                    "Authorization": "Bearer " + token
                }
            }
        );

        const dashboard =
            await dashboardResponse.json();

        if (!dashboardResponse.ok || !dashboard.student) {
            alert("Student profile not found.");
            return;
        }

        const studentId =
            dashboard.student.id;


        const planResponse = await fetch(
            `/students/${studentId}/study-plan`,
            {
                headers: {
                    "Authorization": "Bearer " + token

        const planData =
            await planResponse.json();

            alert(
                planData.detail ||

            planData.plan || planData;

async function addJobApplication() {

    const token =
        localStorage.getItem("careerpilot_token");

    const dashboardResponse = await fetch(
        "/dashboard",
        {
            headers: {
                "Authorization": "Bearer " + token
            }
        }
    );

    const dashboard =
        await dashboardResponse.json();

    if (!dashboard.student) {
        alert("Student profile not found.");
        return;
    }

    const studentId =
        dashboard.student.id;

    const company =
        document.getElementById("jobCompany").value;

    const role =
        document.getElementById("jobRole").value;

    const status =
        document.getElementById("jobStatus").value;

    const appliedDate =
        document.getElementById("jobDate").value;

    const notes =
        document.getElementById("jobNotes").value;


    if (!company || !role) {

        document.getElementById("jobMessage").innerText =
            "Please enter company and role.";

        return;
    }


    const response = await fetch(
        "/jobs/applications",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },

            body: JSON.stringify({

                student_id: studentId,
                company: company,
                role: role,
                status: status,
                applied_date: appliedDate,
                notes: notes

            })
        }
    );


    const data =
        await response.json();


    if (!response.ok) {

        document.getElementById("jobMessage").innerText =
            data.detail ||
            "Failed to save application.";

        return;
    }


    document.getElementById("jobMessage").innerText =
        "✅ Application saved successfully!";


    setTimeout(() => {

        showJobs();

    }, 700);
}
